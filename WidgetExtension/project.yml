name: LimitBarWidgetExtension
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  LimitBar:
    path: ..
targets:
  LimitBarWidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ../Sources/LimitBarWidget
    dependencies:
      - package: LimitBar
        product: LimitBarCore
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LimitBar
        CFBundleName: LimitBarWidget
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LimitBarTeamID: "$(LIMITBAR_TEAM_ID)"
        LSMinimumSystemVersion: "14.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGNING_ALLOWED: false
        ENABLE_DEBUG_DYLIB: false
        ENABLE_APP_SANDBOX: true
        INFOPLIST_KEY_LimitBarTeamID: "$(LIMITBAR_TEAM_ID)"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: "$(LIMITBAR_WIDGET_BUNDLE_ID)"
        PRODUCT_NAME: LimitBarWidget
        SWIFT_VERSION: "6.0"
